name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        perl-version: ['5.26', '5.30', '5.34', '5.38']

    name: Perl ${{ matrix.perl-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}

      - name: Install dependencies
        run: |
          cpanm --notest --installdeps .
          cpanm --notest Test::More

      - name: Run Makefile.PL
        run: perl Makefile.PL

      - name: Build
        run: make

      - name: Run tests
        run: make test
        env:
          TOMBA_API_KEY: ${{ secrets.TOMBA_API_KEY }}
          TOMBA_SECRET_KEY: ${{ secrets.TOMBA_SECRET_KEY }}

  lint:
    runs-on: ubuntu-latest
    name: Perl Critic

    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Install Perl::Critic
        run: cpanm --notest Perl::Critic

      - name: Run perlcritic
        run: perlcritic --profile .perlcriticrc lib/
